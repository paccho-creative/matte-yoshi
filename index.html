<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まて、よし！ - 子犬の刹那の見切り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #000000;
    --bg-soft:   #0a0a0a;
    --paper:     #ffffff;
    --paper-dim: #b8b8b8;
    --ink:       #000000;
    --ink-soft:  #1a1a1a;
    --line:      #ffffff;
    --line-soft: #3a3a3a;
    --accent:    #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Serif JP', serif;
    color: var(--paper);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 9 / 16;
    max-height: calc(100vh - 32px);
    background: var(--bg);
    border-radius: 0;
    box-shadow:
      0 24px 48px -16px rgba(0,0,0,0.8),
      0 0 0 1px var(--paper);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  /* ============ TITLE ============ */
  #titleScreen {
    background: var(--bg);
    justify-content: flex-start;
    padding: 0 0 60px;
    overflow: hidden;
  }

  .hero-photo {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    width: 100%;
    height: 50%;
    object-fit: cover;
    object-position: center 40%;
    z-index: 1;
  }
  .hero-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, var(--bg) 100%);
  }
  .hero-fade {
    position: absolute;
    top: calc(38% + 60px);
    left: 0;
    right: 0;
    height: 16%;
    background: linear-gradient(180deg, transparent 0%, var(--bg) 100%);
    z-index: 2;
    pointer-events: none;
  }

  .title-content {
    position: relative;
    z-index: 3;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 22px 0;
    width: 100%;
    gap: 28px;
  }

  .title-block { text-align: center; }

  .title-main {
    position: absolute;
    top: 80px;
    right: 72px;
    z-index: 4;
    max-height: calc(50% - 40px);
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: clamp(36px, 10vw, 48px);
    line-height: 1.2;
    color: var(--paper);
    margin: 0;
    letter-spacing: 0.12em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .title-main .accent {
    color: var(--bg);
    background: var(--paper);
    display: inline-block;
    padding: 4px 0;
    border: none;
  }

  .puppy-hero { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .stage-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 4px 0 16px;
  }
  .stage-preview .item {
    width: 52px;
    height: 52px;
    background: var(--paper);
    border: 1px solid var(--paper);
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .stage-preview .item img {
    width: 80%;
    height: 80%;
    object-fit: contain;
  }
  .stage-preview .arrow {
    font-size: 14px;
    color: var(--paper-dim);
  }

  /* Icon image used in various places */
  .icon-img {
    display: inline-block;
    object-fit: contain;
    vertical-align: middle;
  }

  .start-btn {
    width: 100%;
    padding: 16px;
    background: var(--paper);
    color: var(--ink);
    border: none;
    border-radius: 0;
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 18px;
    cursor: pointer;
    box-shadow: none;
    transition: background 0.15s ease, transform 0.08s ease;
    letter-spacing: 0.5em;
    text-transform: uppercase;
  }
  .start-btn:active {
    transform: scale(0.98);
    background: var(--paper-dim);
  }

  .rules {
    margin-top: 14px;
    font-family: 'Shippori Mincho', serif;
    font-size: 10px;
    color: var(--paper-dim);
    letter-spacing: 0.2em;
    text-align: center;
    line-height: 2;
  }
  .rules strong {
    color: var(--paper);
    font-weight: 700;
  }

  .high-score-line {
    margin-top: 8px;
    font-family: 'Shippori Mincho', serif;
    font-size: 10px;
    color: var(--paper-dim);
    letter-spacing: 0.25em;
    text-align: center;
  }
  .high-score-line strong {
    color: var(--paper);
    font-size: 12px;
    font-weight: 700;
  }

  /* ============ PLAY ============ */
  #playScreen {
    background: var(--bg);
  }

  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Shippori Mincho', serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--paper-dim);
  }
  .hud .pill {
    background: transparent;
    padding: 0 0 4px;
    border: none;
    border-bottom: 1px solid var(--paper);
    border-radius: 0;
    font-weight: 700;
  }
  .hud .pill .num {
    color: var(--paper);
    font-size: 13px;
    font-weight: 900;
  }

  .stage-banner {
    margin-top: 14px;
    padding: 4px 14px 4px 6px;
    background: var(--paper);
    border: none;
    border-radius: 0;
    font-family: 'Shippori Mincho', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  .stage-banner .ico {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
  }
  .stage-banner .ico img {
    width: 80%;
    height: 80%;
    object-fit: contain;
  }

  .rounds-bar {
    display: none;
  }

  .scene {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    padding: 10px 0 4px;
    gap: 6px;
    min-height: 0;
  }

  .treat {
    width: 70px;
    height: 70px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18));
    animation: treatFloat 3s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 48px;
  }
  .treat img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .dog-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    justify-content: center;
    width: 100%;
    gap: 10px;
    min-height: 0;
  }
  @keyframes treatFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-8px) rotate(3deg); }
  }

  .command {
    position: relative;
    background: var(--bg);
    border: 1.5px solid var(--paper);
    border-radius: 0;
    padding: 12px 32px;
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 36px;
    color: var(--paper);
    box-shadow: none;
    min-width: 180px;
    text-align: center;
    letter-spacing: 0.15em;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .command.go {
    background: var(--paper);
    color: var(--ink);
    border-color: var(--paper);
    transform: scale(1.12);
  }
  .command.fail {
    background: var(--bg);
    color: var(--paper-dim);
    border-color: var(--line-soft);
  }

  .puppy {
    transition: transform 0.3s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 200px;
  }
  .puppy.win  { animation: winJump 0.6s ease; }
  .puppy.lose { animation: loseShake 0.4s ease; }
  @keyframes winJump {
    0%, 100% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-30px) rotate(-8deg); }
    60% { transform: translateY(-10px) rotate(6deg); }
  }
  @keyframes loseShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-4deg); }
    75% { transform: translateX(8px) rotate(4deg); }
  }

  .tap-btn {
    width: 100%;
    padding: 16px;
    margin-top: 6px;
    background: var(--paper);
    color: var(--ink);
    border: none;
    border-radius: 0;
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 20px;
    cursor: pointer;
    box-shadow: none;
    transition: background 0.15s ease, transform 0.08s ease;
    letter-spacing: 0.4em;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .tap-btn:active {
    transform: scale(0.98);
    background: var(--paper-dim);
  }
  .tap-btn:disabled {
    background: var(--ink-soft);
    color: var(--paper-dim);
    cursor: not-allowed;
  }

  .reaction-time {
    text-align: center;
    font-family: 'Shippori Mincho', serif;
    font-size: 11px;
    color: var(--paper-dim);
    margin-top: 4px;
    letter-spacing: 0.2em;
    min-height: 16px;
    flex-shrink: 0;
  }
  .reaction-time strong { color: var(--paper); font-size: 14px; font-weight: 700; }

  /* ============ STAGE TRANSITION ============ */
  #transitionScreen {
    background: var(--bg);
    z-index: 10;
  }
  .transition-card {
    background: var(--paper);
    border: 1.5px solid var(--paper);
    border-radius: 0;
    padding: 32px 36px;
    box-shadow: 12px 12px 0 var(--paper-dim);
    text-align: center;
    animation: cardIn 0.5s ease;
  }
  @keyframes cardIn {
    0%   { transform: scale(0.92) translate(8px, 8px); opacity: 0; }
    100% { transform: scale(1) translate(0, 0); opacity: 1; }
  }
  .transition-tag {
    font-family: 'Shippori Mincho', serif;
    font-size: 11px;
    letter-spacing: 0.5em;
    color: var(--ink-soft);
    text-transform: uppercase;
    font-weight: 700;
  }
  .transition-icon {
    width: 96px;
    height: 96px;
    margin: 20px auto 14px;
    animation: bob 1.2s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .transition-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .transition-name {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--ink);
    letter-spacing: 0.2em;
  }
  .transition-stars {
    margin-top: 10px;
    color: var(--ink);
    font-size: 14px;
    letter-spacing: 0.3em;
  }
  .transition-msg {
    margin-top: 18px;
    font-family: 'Shippori Mincho', serif;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    line-height: 1.6;
  }

  /* ============ RESULT ============ */
  #resultScreen {
    background: var(--bg);
    overflow-y: auto;
  }

  .result-banner {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 30px;
    color: var(--paper);
    margin-bottom: 8px;
    text-align: center;
    line-height: 1.2;
    letter-spacing: 0.15em;
    border-bottom: 2px solid var(--paper);
    padding-bottom: 10px;
    display: inline-block;
  }
  .result-banner.lose {
    color: var(--paper-dim);
    border-color: var(--paper-dim);
  }

  .result-card {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--paper);
    border-radius: 0;
    padding: 4px 18px;
    margin: 14px 0 8px;
  }
  .stage-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    color: var(--paper-dim);
    letter-spacing: 0.1em;
  }
  .stage-row + .stage-row {
    border-top: 1px solid var(--line-soft);
  }
  .stage-row .ico {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stage-row .ico img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .stage-row .name {
    font-weight: 700;
    flex: 1;
    color: var(--paper);
  }
  .stage-row .score {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    color: var(--paper);
    font-size: 13px;
    letter-spacing: 0.15em;
  }
  .stage-row .score.perfect {
    color: var(--paper);
    border-bottom: 1.5px solid var(--paper);
    padding-bottom: 1px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 18px;
    background: var(--paper);
    border: none;
    border-radius: 0;
    margin-top: 8px;
    font-family: 'Shippori Mincho', serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    font-weight: 700;
    color: var(--ink);
  }
  .total-row .v {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--ink);
  }

  .result-buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 16px;
  }
  .btn-secondary, .btn-primary {
    flex: 1;
    padding: 14px;
    border: 1.5px solid var(--paper);
    border-radius: 0;
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .btn-primary {
    background: var(--paper);
    color: var(--ink);
  }
  .btn-secondary {
    background: var(--bg);
    color: var(--paper);
  }
  .btn-primary:active {
    transform: scale(0.98);
    background: var(--paper-dim);
  }
  .btn-secondary:active {
    transform: scale(0.98);
    background: var(--ink-soft);
  }

  .puppy-svg { width: 110px; height: 110px; }
  .puppy-svg-large { width: 160px; height: 160px; }

  /* Real puppy photo (used during play) */
  .puppy-photo {
    width: 230px;
    height: 180px;
    object-fit: contain;
    object-position: bottom center;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.18));
    transition: filter 0.2s ease;
    animation: puppyWiggle 0.9s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .puppy-photo.yoshi {
    width: 200px;
    height: 250px;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
    animation: none;
  }
  .puppy-photo.fail {
    width: 220px;
    height: 240px;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
    animation: none;
  }
  @keyframes puppyWiggle {
    0%   { transform: translate(0, 0) rotate(-3deg); }
    15%  { transform: translate(-3px, -2px) rotate(2deg); }
    30%  { transform: translate(2px, -5px) rotate(-2deg); }
    45%  { transform: translate(-2px, -1px) rotate(4deg); }
    60%  { transform: translate(3px, -3px) rotate(-3deg); }
    75%  { transform: translate(-1px, -6px) rotate(3deg); }
    90%  { transform: translate(2px, -2px) rotate(-2deg); }
    100% { transform: translate(0, 0) rotate(-3deg); }
  }
  .puppy.win .puppy-photo {
    filter:
      drop-shadow(0 8px 6px rgba(0,0,0,0.4))
      drop-shadow(0 0 18px rgba(255,255,255,0.45));
  }
  .puppy.lose .puppy-photo {
    filter:
      drop-shadow(0 8px 6px rgba(0,0,0,0.3))
      grayscale(0.7)
      brightness(0.8);
  }

  @keyframes flash {
    0%   { background: var(--bg); }
    50%  { background: var(--paper); }
    100% { background: var(--bg); }
  }
  #playScreen.go-flash { animation: flash 0.25s ease; }
</style>
</head>
<body>
<div class="stage">

  <!-- =============== TITLE =============== -->
  <div id="titleScreen" class="screen active">
    <img class="hero-photo" id="heroPhoto" alt="">
    <div class="hero-fade"></div>

    <h1 class="title-main">待て、<span class="accent">よし！</span></h1>

    <div class="title-content">
      <div class="title-block">
      </div>

      <div class="rules">
        「よし！」が出たら すばやくタップ<br>
        フライング・おそすぎは <strong>しっぱい</strong>
      </div>

      <button class="start-btn" onclick="startGame()">START</button>

      <div class="high-score-line" id="hiScoreLine"></div>
    </div>
  </div>

  <!-- =============== PLAY =============== -->
  <div id="playScreen" class="screen">


    <div class="rounds-bar" id="roundsBar"></div>

    <div class="scene">
      <div class="treat" id="treatIcon"></div>
      <div class="dog-area">
        <div class="puppy" id="puppyChar">
          <!-- photo injected by JS -->
        </div>
        <div class="command" id="commandBubble">待て...</div>
      </div>
    </div>

    <div class="reaction-time" id="reactionTime">画面のどこをタップしてもOK</div>
    <button class="tap-btn" id="tapBtn">タップ！</button>
  </div>

  <!-- =============== STAGE TRANSITION =============== -->
  <div id="transitionScreen" class="screen">
    <div class="transition-card">
      <div class="transition-tag" id="trTag">STAGE 1 / 3</div>
      <div class="transition-icon" id="trIcon"></div>
      <div class="transition-name" id="trName">クッキー</div>
      <div class="transition-stars" id="trStars">★☆☆</div>
      <div class="transition-msg" id="trMsg">すなおに「よし！」が きます</div>
    </div>
  </div>

  <!-- =============== RESULT =============== -->
  <div id="resultScreen" class="screen">
    <div class="result-banner" id="resultBanner">よくできました！</div>

    <div class="result-card">
      <div class="stage-row">
        <span class="ico" id="rsIco0"></span>
        <span class="name">クッキー</span>
        <span class="score" id="rs0">—</span>
      </div>
      <div class="stage-row">
        <span class="ico" id="rsIco1"></span>
        <span class="name">いちご</span>
        <span class="score" id="rs1">—</span>
      </div>
      <div class="stage-row">
        <span class="ico" id="rsIco2"></span>
        <span class="name">おにく</span>
        <span class="score" id="rs2">—</span>
      </div>
    </div>

    <div class="total-row">
      <span>合計勝利数</span><span class="v" id="rTotal">0 / 3</span>
    </div>
    <div class="total-row">
      <span>ベスト反応速度</span><span class="v" id="rBest">- 秒</span>
    </div>

    <div class="result-buttons">
      <button class="btn-secondary" onclick="goTitle()">タイトル</button>
      <button class="btn-primary" onclick="startGame()">もう一回</button>
    </div>
  </div>

</div>

  const stages = [
    {

  ];
  const ROUNDS_PER_STAGE = 1;
  const TOTAL_ROUNDS = ROUNDS_PER_STAGE * stages.length;

  // ============ STATE ============
  const state = {
    stageIdx: 0,
    round: 0,
    stageWins: [0, 0, 0],
    stageResults: [[], [], []],
    stageTimes: [null, null, null],
    times: [],
    waitingForGo: false,
    goTime: 0,
    timeoutId: null,
    fakeTimeoutId: null,
    canFail: false,
  };

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const screens = {
    title: $('titleScreen'),
    play: $('playScreen'),
    transition: $('transitionScreen'),
    result: $('resultScreen'),
  };
  const cmd = $('commandBubble');
  const puppy = $('puppyChar');
  const tapBtn = $('tapBtn');
  const reactionTime = $('reactionTime');

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ============ AUDIO ============
  let audioCtx = null;
  function beep(freq, dur = 0.1, type = 'sine', vol = 0.15) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  const sfx = {
    matte: () => beep(440, 0.1, 'sine'),
    fake:  () => beep(380, 0.08, 'square', 0.08),
    go:    () => { beep(660, 0.08, 'sine'); setTimeout(() => beep(880, 0.15, 'sine'), 80); },
    win:   () => { beep(523, 0.08); setTimeout(() => beep(659, 0.08), 80); setTimeout(() => beep(784, 0.18), 160); },
    lose:  () => { beep(300, 0.15, 'sawtooth', 0.1); setTimeout(() => beep(200, 0.25, 'sawtooth', 0.1), 120); },
    stage: () => { beep(523, 0.1); setTimeout(() => beep(659, 0.1), 100); setTimeout(() => beep(784, 0.1), 200); setTimeout(() => beep(1047, 0.2), 300); },
  };

  // ============ HI SCORE ============
  function loadHi() {
    try { return JSON.parse(localStorage.getItem('matte-yoshi-hi-v2') || '{}'); }
    catch { return {}; }
  }
  function saveHi(wins, best) {
    const hi = loadHi();
    let updated = false;
    if (!hi.wins || wins > hi.wins) { hi.wins = wins; updated = true; }
    if (best && (!hi.best || best < hi.best)) { hi.best = best; updated = true; }
    if (updated) {
      try { localStorage.setItem('matte-yoshi-hi-v2', JSON.stringify(hi)); } catch {}
    }
    return updated;
  }
  function refreshHiLine() {
    const hi = loadHi();
    if (!hi.wins && !hi.best) { $('hiScoreLine').innerHTML = ''; return; }
    const parts = [];
    if (hi.wins) parts.push(`さいこう <strong>${hi.wins}/3</strong>`);
    if (hi.best) parts.push(`ベスト <strong>${(hi.best/1000).toFixed(3)}秒</strong>`);
    $('hiScoreLine').innerHTML = parts.join('  ');
  }

  // ============ ROUND DOTS ============
  function renderRoundsBar() {
    const bar = $('roundsBar');
    bar.innerHTML = '';
    const results = state.stageResults[state.stageIdx];
    for (let i = 0; i < ROUNDS_PER_STAGE; i++) {
      const dot = document.createElement('div');
      dot.className = 'round-dot';
      if (i < results.length) {
        dot.classList.add(results[i] ? 'win' : 'lose');
      } else if (i === results.length) {
        dot.classList.add('current');
      }
      bar.appendChild(dot);
    }
  }


  // ============ FLOW ============
  function startGame() {
    state.stageIdx = 0;
    state.round = 0;
    state.stageWins = [0, 0, 0];
    state.stageResults = [[], [], []];
    state.stageTimes = [null, null, null];
    state.times = [];
    showStageIntro(0, true);
  }

  function setIconImage(container, iconKey) {
    container.innerHTML = '';
    const img = document.createElement('img');
    img.src = ICONS[iconKey];
    img.alt = iconKey;
    img.draggable = false;
    container.appendChild(img);
  }

  function showStageIntro(idx, isFirst) {
    const s = stages[idx];
    $('trTag').textContent = `STAGE ${idx + 1} / ${stages.length}`;
    setIconImage($('trIcon'), s.iconKey);
    $('trName').textContent = s.name;
    $('trStars').textContent = s.stars;
    $('trMsg').textContent = s.msg;
    show('transition');
    sfx.stage();
    setTimeout(() => beginStage(idx), 1800);
  }

  function beginStage(idx) {
    state.stageIdx = idx;
    state.round = 0;
    const s = stages[idx];
    setIconImage($('treatIcon'), s.iconKey);
    show('play');
    nextRound();
  }

  function nextRound() {
    if (state.round >= ROUNDS_PER_STAGE) {
      const next = state.stageIdx + 1;
      if (next >= stages.length) {
        finishGame();
      } else {
        setTimeout(() => showStageIntro(next, false), 600);
      }
      return;
    }
    state.round++;
    renderRoundsBar();

    cmd.classList.remove('go', 'fail');
    cmd.textContent = '待て...';
    cmd.style.fontSize = '36px';
    puppy.classList.remove('win', 'lose');
    setPuppyPose('matte');
    tapBtn.disabled = false;
    tapBtn.textContent = 'まだ！';
    reactionTime.innerHTML = '画面のどこをタップしてもOK';
    state.waitingForGo = false;
    state.canFail = true;

    sfx.matte();
    scheduleNext();
  }

  function scheduleNext() {
    const cfg = stages[state.stageIdx];
    const wait = cfg.minWait + Math.random() * (cfg.maxWait - cfg.minWait);
    const useFake = cfg.fakes.length > 0 && Math.random() < cfg.fakeChance;

    if (useFake) {
      const fakeAt = wait * (0.4 + Math.random() * 0.3);
      state.fakeTimeoutId = setTimeout(showFake, fakeAt);
    }
    state.timeoutId = setTimeout(showGo, wait);
  }

  function showFake() {
    const cfg = stages[state.stageIdx];
    const fake = cfg.fakes[Math.floor(Math.random() * cfg.fakes.length)];
    cmd.textContent = fake;
    cmd.style.fontSize = fake.length > 3 ? '24px' : '34px';
    sfx.fake();
    setTimeout(() => {
      if (!state.waitingForGo && state.canFail) {
        cmd.textContent = '待て...';
        cmd.style.fontSize = '36px';
      }
    }, 400);
  }

  function showGo() {
    state.waitingForGo = true;
    state.goTime = performance.now();
    cmd.textContent = 'よし！';
    cmd.classList.add('go');
    cmd.style.fontSize = '42px';
    tapBtn.textContent = 'タップ！';
    sfx.go();
    screens.play.classList.add('go-flash');
    setTimeout(() => screens.play.classList.remove('go-flash'), 300);

    state.timeoutId = setTimeout(() => {
      if (state.waitingForGo) endRound(false, 'おそすぎ...');
    }, stages[state.stageIdx].timeout);
  }

  function handleTap() {
    if (!state.canFail) return;
    if (state.waitingForGo) {
      const reaction = Math.round(performance.now() - state.goTime);
      state.times.push(reaction);
      state.stageTimes[state.stageIdx] = reaction;
      endRound(true, `${(reaction/1000).toFixed(3)}秒`);
    } else {
      endRound(false, 'フライング！');
    }
  }

  function endRound(win, msg) {
    state.canFail = false;
    state.waitingForGo = false;
    clearTimeout(state.timeoutId);
    clearTimeout(state.fakeTimeoutId);
    tapBtn.disabled = true;

    if (win) {
      state.stageWins[state.stageIdx]++;
      state.stageResults[state.stageIdx].push(true);
      cmd.textContent = '🎉';
      cmd.classList.remove('go');
      puppy.classList.add('win');
      setPuppyPose('yoshi');
      reactionTime.innerHTML = `<strong>${msg}</strong>`;
      sfx.win();
    } else {
      state.stageResults[state.stageIdx].push(false);
      cmd.textContent = msg;
      cmd.classList.remove('go');
      cmd.classList.add('fail');
      cmd.style.fontSize = '24px';
      puppy.classList.add('lose');
      setPuppyPose('fail');
      reactionTime.textContent = '';
      sfx.lose();
    }
    renderRoundsBar();
    setTimeout(nextRound, 1400);
  }

  function finishGame() {
    const total = state.stageWins.reduce((a, b) => a + b, 0);
    const best = state.times.length ? Math.min(...state.times) : null;

    state.stageWins.forEach((w, i) => {
      const el = $('rs' + i);
      const t = state.stageTimes[i];
      if (w === 1 && t != null) {
        el.textContent = `○ ${(t/1000).toFixed(3)}秒`;
      } else {
        el.textContent = '✕ 失敗';
      }
      el.classList.toggle('perfect', w === 1);
    });
    $('rTotal').textContent = `${total} / ${TOTAL_ROUNDS}`;
    $('rBest').textContent = best ? `${(best/1000).toFixed(3)}秒` : '- 秒';

    let banner;
    if (total === TOTAL_ROUNDS) banner = 'パーフェクト！';
    else if (total === 2)       banner = 'よくできました！';
    else if (total === 1)       banner = 'もうちょっと...';
    else                        banner = 'おてあげ...';

    const isNewBest = saveHi(total, best);
    if (isNewBest) banner += ' 🏆 NEW!';

    const bn = $('resultBanner');
    bn.textContent = banner;
    bn.classList.toggle('lose', total < TOTAL_ROUNDS / 2);

    refreshHiLine();
    show('result');
  }

  function goTitle() { show('title'); refreshHiLine(); }

  // ============ INPUT ============
  tapBtn.addEventListener('click', handleTap);
  screens.play.addEventListener('click', e => {
    if (e.target === tapBtn) return;
    if (!tapBtn.disabled) handleTap();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && screens.play.classList.contains('active') && !tapBtn.disabled) {
      e.preventDefault();
      handleTap();
    }
  });

  refreshHiLine();

  // ============ INIT STATIC ICONS ============
  // Set up title-screen preview and result-screen row icons
  (function setupStaticIcons() {
    stages.forEach((s, i) => {
      const prev = $('prev' + i);
      if (prev) setIconImage(prev, s.iconKey);
      const rsIco = $('rsIco' + i);
      if (rsIco) setIconImage(rsIco, s.iconKey);

    const hero = $('heroPhoto');

  // ============ INIT PUPPY PHOTO ============
  // Show the real photo of the dog during play
  let puppyImg;
  (function setupPuppyPhoto() {
    puppyImg = document.createElement('img');
    puppyImg.src = PUPPY_PHOTO;
    puppyImg.alt = 'puppy';
    puppyImg.className = 'puppy-photo';
    puppyImg.draggable = false;
    puppy.appendChild(puppyImg);
    // Preload the yoshi and fail photos so the swap is instant
    const pre1 = new Image(); pre1.src = YOSHI_PHOTO;

  })();

  function setPuppyPose(pose) {
    if (pose === 'yoshi') {
      puppyImg.src = YOSHI_PHOTO;
      puppyImg.classList.add('yoshi');
      puppyImg.classList.remove('fail');
    } else if (pose === 'fail') {
      puppyImg.src = FAIL_PHOTO;
      puppyImg.classList.add('fail');
      puppyImg.classList.remove('yoshi');
    } else {
      puppyImg.src = PUPPY_PHOTO;
      puppyImg.classList.remove('yoshi');
      puppyImg.classList.remove('fail');
    }
  }
</script>
